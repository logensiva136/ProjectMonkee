[project]
name = "hayabusa"
version = "0.1.0"
description = "Threat intelligence, third-party risk, and external attack surface monitoring"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- web ---
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    # [email] pulls in email-validator, which EmailStr needs at schema-build time.
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.12",

    # --- persistence ---
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "uuid6>=2024.7.10",

    # --- workers ---
    "celery>=5.4,<6",
    "redis>=5.2,<6",
    "celery-redbeat>=2.2,<3",

    # --- collection ---
    "httpx>=0.27,<0.29",
    "feedparser>=6.0.11",
    "jinja2>=3.1.4",

    # --- security ---
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "qrcode[pil]>=8.0",
    "python-jose[cryptography]>=3.3",
    "cryptography>=43.0",
    "zxcvbn>=4.4.28",
    # Logo upload processing: decode, strip metadata, re-encode (SPEC §6.1).
    "pillow>=11.0",

    # --- observability ---
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
    "ARG",  # unused arguments
    "BLE",  # blind except
    "ASYNC",
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture is requested by naming it as a parameter, so fixtures used
# purely for their side effects (`onboarded`, `seeded`) are legitimately unread.
"tests/*" = ["E501", "ARG001", "ARG002"]

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
# SQLAlchemy 2.0 declarative attributes and Celery's decorators are typed loosely
# enough that requiring explicit annotations everywhere costs more than it catches.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "kombu.*",
    "redbeat.*",
    "feedparser.*",
    "zxcvbn.*",
    "jose.*",
    "uuid6.*",
    "qrcode.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery ships no type information, so `celery.Task` resolves to Any and strict
# mode refuses to let anything subclass it. Subclassing Task is the documented
# way to add shared task behaviour, so this is relaxed for the task package only.
module = ["app.tasks.*"]
disallow_subclassing_any = false

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
