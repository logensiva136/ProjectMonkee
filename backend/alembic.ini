[alembic]
script_location = alembic
prepend_sys_path = .

# Migration filenames sort chronologically and say what they do:
#   2026_07_29_1412-a1b2c3d4e5f6_add_vendor_table.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

timezone = UTC

# The URL is injected from app.config in env.py so there is exactly one place
# where the database location is configured (SPEC §4: everything env-driven).
sqlalchemy.url =

[post_write_hooks]
# `exec`, not `console_scripts`: ruff installs a compiled binary shim rather
# than a Python console-script entry point, so console_scripts cannot find it.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Alembic's own logging is replaced by structlog in env.py; these sections exist
# because alembic's config parser requires them.
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
