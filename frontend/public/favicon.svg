<!--
  HAYABUSA mark. "Hayabusa" is the peregrine falcon — the shape is a stooping
  wing, reduced to two angular strokes.

  SPEC §9.1 explicitly rules out the neon-cyberpunk cliche: no skull, no
  terminal prompt, no mascot. Geometry and one accent colour only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#0A0B0D" />
  <path
    d="M7 8 L16 21 L25 8"
    fill="none"
    stroke="#22D3EE"
    stroke-width="2.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <path d="M11 22 L16 26 L21 22" fill="none" stroke="#3A4149" stroke-width="2.5" stroke-linecap="square" />
</svg>
