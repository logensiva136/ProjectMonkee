# Nginx serving the built SPA and reverse-proxying the API (SPEC §2, §10).
#
# Everything the browser touches is same-origin: the bundle and /api both come
# from this server. That removes CORS entirely and lets the SameSite=Strict
# refresh cookie (SPEC §6.2) work without exception.

upstream hayabusa_api {
    server api:8000;
    keepalive 32;
}

# Real client IP for the API's rate limiter and audit log. Without this every
# request would appear to originate from nginx.
map $http_x_forwarded_for $client_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version on error pages or in Server:.
    server_tokens off;

    # Uploads are org logos (<=2 MB per SPEC §6.1) and bulk imports.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    # ---------------------------------------------------------------- security
    # Read snippets/security-headers.conf before editing: any location block
    # below that sets its own add_header must re-include this, or it loses every
    # header set here.
    include /etc/nginx/snippets/security-headers.conf;

    # ------------------------------------------------------------------- api --
    location /api/ {
        proxy_pass http://hayabusa_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Collection tests and EASM scans can legitimately take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Streamed responses (SSE, large exports) must not be buffered whole.
        proxy_buffering off;
    }

    # ------------------------------------------------------------ websocket --
    # Live alerts, scan progress and collection runs (SPEC §7 /ws/events).
    location /ws/ {
        proxy_pass http://hayabusa_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # A quiet socket must survive between events.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------- static ----
    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /theme-init.js {
        include /etc/nginx/snippets/security-headers.conf;
        # Small and read before first paint — revalidate rather than cache hard,
        # so a change to it is picked up on the next load.
        add_header Cache-Control "no-cache" always;
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # previous bundle's asset names. `try_files` in `location /` re-matches
    # locations internally, so the main document is served from HERE — which is
    # why the security headers must be repeated.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Client-side routing: unknown paths return the SPA, which routes them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's own liveness, distinct from the API's /health.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
