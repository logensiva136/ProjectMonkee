# Security response headers (SPEC §10).
#
# WHY THIS IS A SEPARATE FILE, AND WHY IT IS INCLUDED REPEATEDLY:
#
# nginx's `add_header` is inherited by a nested block ONLY IF that block defines
# no `add_header` of its own. A single `add_header Cache-Control ...` inside a
# location silently drops every header set at the server level — including this
# CSP. Because `try_files ... /index.html` internally re-matches
# `location = /index.html`, that is exactly what happened to the main document:
# the HTML page, the one response where CSP matters most, was served without it.
#
# So: any location block that sets an add_header MUST also include this file.
# There is no inheritance mechanism in nginx that avoids the repetition.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Two deliberate loosenings:
#  - style-src 'unsafe-inline': React sets inline styles and Recharts sizes its
#    SVG that way. Removing it breaks every chart in the product.
#  - script-src stays 'self' with no 'unsafe-inline'. That is why the theme
#    bootstrap lives in /theme-init.js instead of an inline <script>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
